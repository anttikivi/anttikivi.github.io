<!DOCTYPE html>
<html>
	<head id="head">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<!-- TODO: This looks horrible but works! -->
		<title><ctx :if="$page.custom.has('home').not()"><ctx :text="$page.title"></ctx><ctx> - </ctx></ctx><ctx :text="$site.title"></ctx></title>
		<ctx description="$page.description.len().gt(0).then($page.description, $i18n.get('site_description'))">
			<meta name="description" content="$ctx.description">
		</ctx>
		<link type="text/css" rel="stylesheet" href="$site.asset('style.css').link()">
		<super>
	</head>
	<body id="body">
		<h1 class="site-title" :text="$site.title"></h1>
		<super>
	</body>
</html>
