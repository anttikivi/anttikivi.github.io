<!DOCTYPE html>
<html lang="$site.localeCode()">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title><ctx :if="$page.custom.has('home').not()"><ctx :text="$page.title"></ctx><ctx> - </ctx></ctx><ctx :text="$site.title"></ctx></title>
		<ctx description="$page.description.len().gt(0).then($page.description, $i18n.get('site_description'))">
			<meta name="description" content="$ctx.description">
		</ctx>

		<!-- TODO: Sitemap? -->

		<ctx :if="$page.custom.has('not_found').or($site.custom.get('robots_disallow_all'))">
			<meta name="robots" content="noindex">
		</ctx>

		<link rel="icon" href="/favicon.ico" sizes="32x32">
		<ctx :if="$build.development">
			<link rel="icon" href="$site.asset('icon.svg').link()" type="image/svg+xml">
			<link rel="apple-touch-icon" href="$site.asset('apple-touch-icon.png').link()">
		</ctx>
		<ctx :if="$build.development.not()">
			<link rel="icon" href="$site.asset('icon.bffcd0c82958e83e6cf0983e26fda24b666d47a0a5e6c5317cfe8ecd5746afff.svg').link()" type="image/svg+xml">
			<link rel="apple-touch-icon" href="$site.asset('apple-touch-icon.8f167af04a4d22a841be0ba16265ee3710eda3dead4febdc1d38f1bcdc1d80ec.png').link()">
		</ctx>

		<link rel="canonical" href="$site.host_url.addPath($page.link())">
		<ctx :loop="$page.locales()">
			<link rel="alternate" hreflang="$loop.it.site().localeCode()" href="$loop.it.site().host_url.addPath($loop.it.link())">
		</ctx>
		<link rel="alternate" hreflang="x-default" href="$site.locale('en-GB').host_url.addPath($page.locale('en-GB').link())">

		<ctx :if="$page.custom.has('home').not()">
			<meta property="og:title" content="$page.title">
		</ctx>
		<ctx :if="$page.custom.has('home')">
			<meta property="og:title" content="$site.title">
		</ctx>
		<meta property="og:type" content="website">
		<meta property="og:url" content="$site.host_url.addPath($page.link())">
		<ctx :if="$page.site().localeCode().contains('-')">
			<ctx first="$page.site().localeCode().splitN('-', 0)" second="$page.site().localeCode().splitN('-', 1)">
				<meta property="og:locale" content="$i18n.get('opengraph_locale_format').fmt($ctx.first, $ctx.second)">
			</ctx>
		</ctx>
		<ctx :if="$page.site().localeCode().eql('fi')">
			<ctx first="$page.site().localeCode()">
				<meta property="og:locale" content="$i18n.get('opengraph_locale_format').fmt($ctx.first, 'FI')">
			</ctx>
		</ctx>
		<ctx :loop="$page.locales()">
			<ctx :if="$loop.it.link().eql($page.link()).not()">
				<ctx :if="$loop.it.site().localeCode().contains('-')">
					<ctx first="$loop.it.site().localeCode().splitN('-', 0)" second="$loop.it.site().localeCode().splitN('-', 1)">
						<meta property="og:locale:alternate" content="$i18n.get('opengraph_locale_format').fmt($ctx.first, $ctx.second)">
					</ctx>
				</ctx>
				<ctx :if="$loop.it.site().localeCode().eql('fi')">
					<ctx first="$loop.it.site().localeCode()">
						<meta property="og:locale:alternate" content="$i18n.get('opengraph_locale_format').fmt($ctx.first, 'FI')">
					</ctx>
				</ctx>
			</ctx>
		</ctx>
		<ctx description="$page.description.len().gt(0).then($page.description, $i18n.get('site_description'))">
			<meta property="og:description" content="$ctx.description">
		</ctx>
		<meta property="og:site_name" content="$site.title">
		<ctx :if="$build.development">
			<meta property="og:image" content="$site.host_url.addPath($site.asset('opengraph-image.png').link())">
		</ctx>
		<ctx :if="$build.development.not()">
			<meta property="og:image" content="$site.host_url.addPath($site.asset('opengraph-image.89ce175510d1d4b7bf0d760baae59bc88be3b5dc287694a582e4df0e52b1c7b2.png').link())">
		</ctx>
		<meta property="og:image:alt" content="$i18n.get('opengraph_image_alt')">

		<ctx :if="$build.development">
			<link type="text/css" rel="stylesheet" href="$site.asset('style.css').link()">
		</ctx>
		<ctx :if="$build.development.not()">
			<link type="text/css" rel="stylesheet" href="$site.asset('style.2d84a75ad8f7fa12f3fc41fd23572335b1e11761ff8f2769c1a874fad891da13.css').link()">
		</ctx>
	</head>
	<body id="body">
		<a class="skip-link" href="$site.custom.get('skip_link_fmt').fmt($i18n.get('main_id'))" :text="$i18n.get('skip_link')"></a>
		<header class="site-header container" id="header">
			<div class="banner">
				<ctx :if="$page.custom.has('home').not()">
					<a class="title" href="$site.link()" :text="$site.title"></a>
				</ctx>
				<ctx :if="$page.custom.has('home')">
					<h1 class="title" :text="$site.title"></h1>
				</ctx>
				<ctx :if="$page.locales().len.gt(1)">
					<ul class="menu locale-menu" :loop="$page.locales()">
						<ctx :if="$loop.it.site().localeCode().eql($site.localeCode()).not()">
							<li lang="$loop.it.site().localeCode()">
								<a href="$loop.it.link()" :text="$loop.it.site().localeName()"></a>
							</li>
						</ctx>
					</ul>
				</ctx>
			</div>
		</header>
		<super>
		<footer class="site-footer container">
			<small :html="$i18n.get('footer_copyright')"></small>
			<ctx :if="$site.custom.get('display_license')">
				<small :html="$i18n.get('footer_license').fmt('https://github.com/anttikivi/anttikivi.github.io', 'https://www.gnu.org/licenses/agpl-3.0.en.html')"></small>
			</ctx>
			<ctx :if="$page.custom.has('home').not()">
				<ctx :if="$page.custom.has('not_found')">
					<a class="logo-link" href="$site.link()" :html="$site.asset($site.custom.get('footer_logo_not_found_fmt').fmt($site.localeCode())).bytes()"></a>
				</ctx>
				<ctx :if="$page.custom.has('not_found').not()">
					<a class="logo-link" href="$site.link()" :html="$site.asset($site.custom.get('footer_logo_fmt').fmt($site.localeCode())).bytes()"></a>
				</ctx>
			</ctx>
			<ctx :if="$page.custom.has('home')" :html="$site.asset($site.custom.get('footer_logo_fmt').fmt($site.localeCode())).bytes()"></ctx>
		</footer>
	</body>
</html>
